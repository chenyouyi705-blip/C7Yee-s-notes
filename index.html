<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记要 · 会议记录与要点提取</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

:root{
  --ink:#1B2130;
  --ink-soft:#5B6472;
  --paper:#E8EAE4;
  --card:#F4F5F1;
  --white:#FFFFFF;
  --accent:#FFCB47;
  --accent-ink:#2B2100;
  --rec:#E2472E;
  --line:#D3D6CE;
  --radius:2px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:720px;margin:0 auto;padding:20px 18px 60px;}

/* ---------- Header / signature waveform ---------- */
header{padding:18px 0 22px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:6px;
}
h1{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:34px;
  margin:0 0 4px;
  letter-spacing:-.01em;
}
.tagline{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}

.wave{display:flex;align-items:flex-end;gap:3px;height:26px;margin:14px 0 4px;}
.wave span{
  display:block;width:3px;background:var(--ink);opacity:.25;border-radius:1px;
  animation:wv 1.6s ease-in-out infinite;
}
.wave.live span{background:var(--rec);opacity:.9;animation-duration:.7s;}
.wave span:nth-child(1){height:30%;animation-delay:.0s;}
.wave span:nth-child(2){height:60%;animation-delay:.1s;}
.wave span:nth-child(3){height:100%;animation-delay:.2s;}
.wave span:nth-child(4){height:45%;animation-delay:.3s;}
.wave span:nth-child(5){height:80%;animation-delay:.4s;}
.wave span:nth-child(6){height:35%;animation-delay:.5s;}
.wave span:nth-child(7){height:65%;animation-delay:.6s;}
.wave span:nth-child(8){height:25%;animation-delay:.7s;}
@keyframes wv{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
@media (prefers-reduced-motion: reduce){.wave span{animation:none;}}

/* ---------- Nav tabs ---------- */
nav{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px;}
nav button{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;letter-spacing:.04em;
  background:none;border:none;padding:10px 4px;margin-right:22px;
  color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;
}
nav button.active{color:var(--ink);border-bottom-color:var(--accent);}

/* ---------- Cards / list ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px;margin-bottom:12px;cursor:pointer;position:relative;
}
.card:hover{border-color:var(--ink-soft);}
.card .tab{
  position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--line);
}
.card.done .tab{background:var(--accent);}
.card h3{margin:0 0 4px;font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
.card .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
.empty{
  text-align:center;padding:50px 20px;color:var(--ink-soft);
  border:1px dashed var(--line);border-radius:var(--radius);font-size:14px;
}

/* ---------- Form elements ---------- */
label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px;}
input[type=text],textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;resize:vertical;
}
textarea{min-height:160px;line-height:1.6;}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}

.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
button.primary,button.ghost,button.rec{
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;
  padding:10px 16px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--ink);
}
button.primary{background:var(--ink);color:var(--white);}
button.primary:disabled{opacity:.4;cursor:default;}
button.ghost{background:none;color:var(--ink);}
button.rec{background:var(--white);color:var(--rec);border-color:var(--rec);}
button.rec.active{background:var(--rec);color:var(--white);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.hint{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}

/* ---------- Extraction / detail view ---------- */
.section-title{
  font-family:'Fraunces',serif;font-weight:600;font-size:15px;
  margin:22px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-title .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;}
ul.points{list-style:none;margin:0;padding:0;}
ul.points li{
  position:relative;padding:8px 0 8px 20px;border-bottom:1px solid var(--line);
  font-size:14px;line-height:1.6;
}
ul.points li:last-child{border-bottom:none;}
ul.points li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:3px;background:var(--accent);}
.action-item{
  display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);
  font-size:14px;
}
.action-item:last-child{border-bottom:none;}
.owner{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
.transcript-box{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;font-size:13px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;
  max-height:260px;overflow-y:auto;
}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.back{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);background:none;border:none;cursor:pointer;}
.status-msg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- Storage helpers ---------------- */
const INDEX_KEY = 'meetings-index';

async function loadIndex(){
  try{
    const r = await window.storage.get(INDEX_KEY, false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(idx){
  await window.storage.set(INDEX_KEY, JSON.stringify(idx), false);
}
async function loadMeeting(id){
  try{
    const r = await window.storage.get('meeting:'+id, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveMeeting(m){
  await window.storage.set('meeting:'+m.id, JSON.stringify(m), false);
}
async function deleteMeetingStorage(id){
  try{ await window.storage.delete('meeting:'+id, false); }catch(e){}
}

/* ---------------- App state ---------------- */
let view = 'list';       // list | new | detail
let currentId = null;
let recognizing = false;
let recognition = null;
let draftTranscript = '';
let draftTitle = '';
let extracting = false;
let extractError = '';

const app = document.getElementById('app');

function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+
    '  '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function waveHTML(live){
  return `<div class="wave ${live?'live':''}">${'<span></span>'.repeat(8)}</div>`;
}

/* ---------------- Render: shell ---------------- */
async function render(){
  let body = '';
  if(view === 'list') body = await renderList();
  else if(view === 'new') body = renderNew();
  else if(view === 'detail') body = await renderDetail();

  app.innerHTML = `
    <header>
      <div class="eyebrow">MEETING NOTES — 私人工具</div>
      <h1>记要</h1>
      <p class="tagline">把会议里说过的话，变成记得住的要点。</p>
      ${waveHTML(recognizing)}
    </header>
    <nav>
      <button data-nav="list" class="${view!=='new' && view!=='detail' ? 'active':''}">历史记录</button>
      <button data-nav="new" class="${view==='new'?'active':''}">+ 新建记录</button>
    </nav>
    <div id="body">${body}</div>
  `;
  app.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{ view = b.dataset.nav; if(view==='new'){draftTranscript='';draftTitle='';extractError='';} render(); };
  });
  attachViewHandlers();
}

/* ---------------- List view ---------------- */
async function renderList(){
  const idx = await loadIndex();
  if(idx.length === 0){
    return `<div class="empty">还没有会议记录。<br>点击上方"新建记录"，粘贴文字稿或试试语音转写。</div>`;
  }
  idx.sort((a,b)=>b.createdAt - a.createdAt);
  return idx.map(m=>`
    <div class="card ${m.hasExtraction?'done':''}" data-open="${m.id}">
      <div class="tab"></div>
      <h3>${escapeHtml(m.title || '未命名会议')}</h3>
      <div class="meta">${fmtDate(m.createdAt)} · ${m.hasExtraction ? '已提取要点' : '仅有文字稿'}</div>
    </div>
  `).join('');
}

/* ---------------- New entry view ---------------- */
function renderNew(){
  return `
    <label>会议标题（可选）</label>
    <input type="text" id="titleInput" placeholder="例如：8月27日 产品评审会" value="${escapeHtml(draftTitle)}">

    <div class="btnrow" style="margin-top:16px;">
      <button class="rec ${recognizing?'active':''}" id="recBtn">${recognizing ? '● 停止录音转写' : '🎙 开始录音转写（实验性）'}</button>
    </div>
    <p class="hint">依赖浏览器自带的语音识别，仅部分浏览器（如桌面版 Chrome）支持，且需要授权麦克风。如果无法使用，请直接在下方粘贴已有的文字稿（例如录音软件自动生成的转写文本）。</p>

    <label>会议文字稿</label>
    <textarea id="transcriptInput" placeholder="在这里粘贴会议文字稿，或使用上方录音转写自动填入…">${escapeHtml(draftTranscript)}</textarea>

    <div class="btnrow">
      <button class="primary" id="saveBtn">保存记录</button>
      <button class="ghost" id="extractBtn">保存并提取要点</button>
    </div>
    ${extracting ? '<p class="status-msg">AI 正在阅读文字稿并提取要点…</p>' : ''}
    ${extractError ? `<p class="status-msg" style="color:var(--rec);">${escapeHtml(extractError)}</p>` : ''}
  `;
}

/* ---------------- Detail view ---------------- */
async function renderDetail(){
  const m = await loadMeeting(currentId);
  if(!m) return `<div class="empty">这条记录已被删除。</div>`;

  let extractionHTML = '';
  if(m.extraction){
    const ex = m.extraction;
    extractionHTML = `
      ${ex.summary ? `<div class="section-title"><span class="dot"></span>主题</div><p style="font-size:14px;line-height:1.6;">${escapeHtml(ex.summary)}</p>` : ''}
      ${ex.key_points && ex.key_points.length ? `
        <div class="section-title"><span class="dot"></span>关键要点</div>
        <ul class="points">${ex.key_points.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>` : ''}
      ${ex.decisions && ex.decisions.length ? `
        <div class="section-title"><span class="dot"></span>决定事项</div>
        <ul class="points">${ex.decisions.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>` : ''}
      ${ex.action_items && ex.action_items.length ? `
        <div class="section-title"><span class="dot"></span>待办事项</div>
        ${ex.action_items.map(a=>`<div class="action-item"><span>${escapeHtml(a.task||'')}</span><span class="owner">${escapeHtml(a.owner||'未指定')}</span></div>`).join('')}` : ''}
    `;
  } else {
    extractionHTML = `<p class="hint">还没有提取要点。</p><div class="btnrow"><button class="primary" id="extractDetailBtn">提取要点</button></div>
    ${extracting ? '<p class="status-msg">AI 正在阅读文字稿并提取要点…</p>' : ''}
    ${extractError ? `<p class="status-msg" style="color:var(--rec);">${escapeHtml(extractError)}</p>` : ''}`;
  }

  return `
    <div class="top-actions">
      <button class="back" id="backBtn">‹ 返回列表</button>
      <button class="back" id="deleteBtn" style="color:var(--rec);">删除</button>
    </div>
    <h3 style="font-family:'Fraunces',serif;font-size:22px;margin:8px 0 2px;">${escapeHtml(m.title||'未命名会议')}</h3>
    <div class="meta" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);">${fmtDate(m.createdAt)}</div>

    ${extractionHTML}

    <div class="section-title"><span class="dot"></span>原始文字稿</div>
    <div class="transcript-box">${escapeHtml(m.transcript)}</div>
  `;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Event handlers per view ---------------- */
function attachViewHandlers(){
  if(view === 'list'){
    document.querySelectorAll('[data-open]').forEach(c=>{
      c.onclick = ()=>{ currentId = c.dataset.open; view='detail'; extractError=''; render(); };
    });
  }
  if(view === 'new'){
    const titleInput = document.getElementById('titleInput');
    const transcriptInput = document.getElementById('transcriptInput');
    titleInput.oninput = e=> draftTitle = e.target.value;
    transcriptInput.oninput = e=> draftTranscript = e.target.value;

    document.getElementById('recBtn').onclick = toggleRecognition;
    document.getElementById('saveBtn').onclick = ()=> commitNew(false);
    document.getElementById('extractBtn').onclick = ()=> commitNew(true);
  }
  if(view === 'detail'){
    document.getElementById('backBtn').onclick = ()=>{ view='list'; render(); };
    document.getElementById('deleteBtn').onclick = async ()=>{
      const idx = await loadIndex();
      const next = idx.filter(m=>m.id !== currentId);
      await saveIndex(next);
      await deleteMeetingStorage(currentId);
      view='list'; render();
    };
    const exBtn = document.getElementById('extractDetailBtn');
    if(exBtn) exBtn.onclick = ()=> runExtractionForDetail();
  }
}

/* ---------------- Speech recognition (best-effort) ---------------- */
function toggleRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    extractError = '当前浏览器不支持语音识别，请改用粘贴文字稿的方式。';
    render();
    return;
  }
  if(recognizing){
    recognition && recognition.stop();
    recognizing = false;
    render();
    return;
  }
  try{
    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.continuous = true;
    recognition.interimResults = true;
    let finalText = draftTranscript ? draftTranscript + '\n' : '';
    recognition.onresult = (e)=>{
      let interim = '';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t + '\n';
        else interim += t;
      }
      draftTranscript = finalText + interim;
      const ta = document.getElementById('transcriptInput');
      if(ta) ta.value = draftTranscript;
    };
    recognition.onerror = ()=>{
      extractError = '语音识别出错或未获得麦克风权限，请改用粘贴文字稿方式。';
      recognizing = false;
      render();
    };
    recognition.onend = ()=>{
      recognizing = false;
      render();
    };
    recognition.start();
    recognizing = true;
    extractError = '';
    render();
  }catch(err){
    extractError = '无法启动语音识别，请改用粘贴文字稿方式。';
    render();
  }
}

/* ---------------- Save / extract ---------------- */
async function commitNew(withExtraction){
  const text = draftTranscript.trim();
  if(!text){
    extractError = '文字稿是空的，先粘贴内容或用录音转写生成文字。';
    render();
    return;
  }
  if(recognizing){ recognition && recognition.stop(); recognizing=false; }

  const id = 'm_' + Date.now();
  const meeting = {
    id, title: draftTitle.trim(), transcript: text,
    createdAt: Date.now(), extraction: null
  };
  await saveMeeting(meeting);
  const idx = await loadIndex();
  idx.push({id, title: meeting.title, createdAt: meeting.createdAt, hasExtraction:false});
  await saveIndex(idx);

  currentId = id;
  extractError = '';

  if(withExtraction){
    view = 'detail';
    render();
    await runExtractionForDetail();
  } else {
    view = 'detail';
    render();
  }
}

async function runExtractionForDetail(){
  const m = await loadMeeting(currentId);
  if(!m) return;
  extracting = true;
  extractError = '';
  render();

  try{
    const extraction = await extractKeyPoints(m.transcript);
    m.extraction = extraction;
    await saveMeeting(m);
    const idx = await loadIndex();
    const entry = idx.find(x=>x.id===m.id);
    if(entry) entry.hasExtraction = true;
    await saveIndex(idx);
  }catch(err){
    extractError = 'AI 提取要点失败，请稍后重试。（' + (err.message || '未知错误') + '）';
  }
  extracting = false;
  render();
}

async function extractKeyPoints(transcript){
  const sys = `你是专业的会议纪要助手。阅读用户提供的会议文字稿，用中文提取结构化信息。
只返回一个 JSON 对象，不要包含任何前言、解释或 markdown 代码块标记。
JSON 格式必须是：
{
  "summary": "一句话概括这次会议的主题",
  "key_points": ["要点1", "要点2", ...],
  "decisions": ["决定事项1", ...],
  "action_items": [{"task":"待办内容","owner":"负责人（若文字稿未提及则填'未指定'）"}]
}
如果某个字段没有相关内容，返回空数组。要点和待办要精炼、具体，避免空话。`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: sys,
      messages: [{ role: "user", content: transcript }]
    })
  });

  if(!response.ok){
    throw new Error('接口返回状态 ' + response.status);
  }
  const data = await response.json();
  const text = (data.content || [])
    .map(b => b.type === 'text' ? b.text : '')
    .join('\n')
    .trim();
  const clean = text.replace(/^```json\s*|^```\s*|```$/gmi, '').trim();
  return JSON.parse(clean);
}

render();
</script>
</body>
</html>
